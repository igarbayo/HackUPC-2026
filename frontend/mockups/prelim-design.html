<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CONFIG & MOCK DATA
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const DEFAULT_CONFIG = {
  aisles: 6,
  levels: 5,
  depth: 14,
  aisleWidth: 1.5,
  rackDepth: 0.85,
  levelHeight: 1.35,
  postSize: 0.07,
};

function makeMockData(cfg) {
  const shuttles = [];
  for (let a = 0; a < cfg.aisles; a++) {
    for (let l = 0; l < cfg.levels; l++) {
      const halfDepth = (cfg.depth - 1) * 0.9 / 2;
      shuttles.push({
        id: `SH-A${a+1}-L${l+1}`,
        aisle: a, level: l,
        posZ: (Math.random() - 0.5) * halfDepth * 2,
        targetZ: (Math.random() - 0.5) * halfDepth * 2,
        speed: 0.015 + Math.random() * 0.025,
        carrying: Math.random() > 0.45,
        status: Math.random() > 0.05 ? 'active' : 'idle',
        waitTimer: 0, waiting: false,
      });
    }
  }
  const robots = Array.from({ length: cfg.aisles }, (_, i) => ({
    id: `ROB-${i+1}`,
    aisle: i,
    status: Math.random() > 0.25 ? 'picking' : 'idle',
    palletCount: Math.floor(Math.random() * 24),
    throughput: Math.floor(Math.random() * 80 + 60),
  }));
  return { shuttles, robots, timestamp: Date.now() };
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// THREE.JS SCENE CLASS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

class SiloScene {
  constructor(canvas, cfg) {
    this.canvas = canvas;
    this.cfg = cfg;
    this.alive = true;
    this.view = 'silo';
    this.selectedAisle = 0;
    this.shuttleData = [];
    this.robotData = [];
    this.aisleGroups = [];

    // Orbit state
    this.orb = { theta: 0.6, phi: 0.42, r: 38, tTheta: 0.6, tPhi: 0.42, tR: 38 };
    this.camTarget = new THREE.Vector3(0, 3.5, 0);
    this.camGoal   = new THREE.Vector3(0, 3.5, 0);
    this.drag = { active: false, x: 0, y: 0 };

    this._init();
    this._bindEvents();
    this._loop();
  }

  _init() {
    const { canvas, cfg } = this;

    // Renderer
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.1;
    this._resize();

    // Scene
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xf8f7f5);
    this.scene.fog = new THREE.FogExp2(0xf8f7f5, 0.014);

    // Camera
    this.camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
    this._applyCamPos();

    // Lights
    const amb = new THREE.AmbientLight(0xffffff, 0.55);
    this.scene.add(amb);

    const sun = new THREE.DirectionalLight(0xfff5e8, 1.1);
    sun.position.set(18, 35, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 120 });
    this.scene.add(sun);

    const fill = new THREE.DirectionalLight(0xd0e8ff, 0.35);
    fill.position.set(-15, 12, -8);
    this.scene.add(fill);

    const under = new THREE.HemisphereLight(0xffffff, 0xd8cfc0, 0.25);
    this.scene.add(under);

    // Materials palette
    this.M = {
      rack:    new THREE.MeshLambertMaterial({ color: 0x9e9e9e }),
      rackDk:  new THREE.MeshLambertMaterial({ color: 0x6e6e6e }),
      rail:    new THREE.MeshLambertMaterial({ color: 0xbdbdbd }),
      box:     new THREE.MeshLambertMaterial({ color: 0xc9a96e }),
      boxDk:   new THREE.MeshLambertMaterial({ color: 0xa07840 }),
      shuttle: new THREE.MeshLambertMaterial({ color: 0xd8d8d8 }),
      shuttleHL: new THREE.MeshLambertMaterial({ color: 0x5ba3f5, emissive: 0x1a4a8a, emissiveIntensity: 0.15 }),
      robot:   new THREE.MeshLambertMaterial({ color: 0x1c1c1c }),
      robotAcc:new THREE.MeshLambertMaterial({ color: 0xf5a623, emissive: 0x603000, emissiveIntensity: 0.2 }),
      pallet:  new THREE.MeshLambertMaterial({ color: 0x7a5c1e }),
      floor:   new THREE.MeshLambertMaterial({ color: 0xe4e2dc }),
      ceiling: new THREE.MeshLambertMaterial({ color: 0xd8d6d0, transparent: true, opacity: 0.35 }),
    };

    this._buildWarehouse();
  }

  // ── Geometry helpers ─────────────────────────────────────

  _box(w, h, d, mat, px=0, py=0, pz=0, group=null) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(px, py, pz);
    m.castShadow = true; m.receiveShadow = true;
    (group || this.scene).add(m);
    return m;
  }

  // ── Warehouse build ──────────────────────────────────────

  _buildWarehouse() {
    const { cfg: C, M } = this;
    const AS = C.aisleWidth + C.rackDepth * 2; // aisle span
    const GAP = 0.28;
    const TW = C.aisles * (AS + GAP) - GAP;
    const TH = C.levels * C.levelHeight;
    const DL = (C.depth - 1) * 0.9; // depth length in units

    this._tw = TW; this._as = AS; this._gap = GAP; this._dl = DL;

    // Floor slab
    const floorMesh = this._box(TW + 6, 0.12, DL + 8, M.floor, 0, -0.06, 0);
    floorMesh.receiveShadow = true;

    // Floor grid
    const grid = new THREE.GridHelper(Math.max(TW, DL) + 12, Math.max(TW, DL) + 12, 0xc8c6c0, 0xc8c6c0);
    grid.material.transparent = true; grid.material.opacity = 0.25;
    this.scene.add(grid);

    // Ceiling panels (translucent)
    this._box(TW + 2, 0.08, DL + 2, M.ceiling, 0, TH + 0.5, 0);

    // Build each aisle
    for (let a = 0; a < C.aisles; a++) {
      const ax = -TW/2 + a * (AS + GAP) + AS/2;
      const ag = new THREE.Group();
      ag.position.set(ax, 0, 0);
      this.scene.add(ag);
      this.aisleGroups.push(ag);
      this._buildAisle(ag, a, DL);
    }

    // Robots at front of each aisle
    this._buildRobots(DL);
  }

  _buildAisle(g, aisleIdx, DL) {
    const { cfg: C, M } = this;
    const HA = C.aisleWidth / 2;   // half aisle width
    const RD = C.rackDepth;
    const TH = C.levels * C.levelHeight;
    const PS = C.postSize;

    // ─ Vertical posts ─
    const nCols = Math.floor(C.depth / 2) + 1;
    for (let ci = 0; ci < nCols; ci++) {
      const z = -DL/2 + ci * (DL / (nCols - 1));
      // 4 posts per column (left-outer, left-inner, right-inner, right-outer)
      [[-HA - RD, z], [-HA, z], [HA, z], [HA + RD, z]].forEach(([px, pz]) => {
        const post = new THREE.Mesh(new THREE.BoxGeometry(PS, TH, PS), M.rack);
        post.position.set(px, TH/2, pz);
        post.castShadow = true;
        g.add(post);
      });
    }

    // ─ Horizontal cross-beams at each level ─
    for (let l = 0; l <= C.levels; l++) {
      const y = l * C.levelHeight;
      const beamH = 0.065, beamW = 0.055;
      const bGeo = new THREE.BoxGeometry(beamW, beamH, DL);

      // Left rack: two beams along Z
      [[-HA - RD + 0.04], [-HA - 0.04]].forEach(([px]) => {
        const b = new THREE.Mesh(bGeo, M.rackDk);
        b.position.set(px, y, 0); g.add(b);
      });
      // Right rack
      [[HA + 0.04], [HA + RD - 0.04]].forEach(([px]) => {
        const b = new THREE.Mesh(bGeo, M.rackDk);
        b.position.set(px, y, 0); g.add(b);
      });

      // Cross-beams every nCols interval
      if (l < C.levels) {
        const nCols = Math.floor(C.depth / 2) + 1;
        for (let ci = 0; ci < nCols; ci++) {
          const z = -DL/2 + ci * (DL / (nCols - 1));
          // left rack lateral beam
          const lb = new THREE.Mesh(new THREE.BoxGeometry(RD, beamH, beamW), M.rack);
          lb.position.set(-HA - RD/2, y, z); g.add(lb);
          // right
          const rb = new THREE.Mesh(new THREE.BoxGeometry(RD, beamH, beamW), M.rack);
          rb.position.set(HA + RD/2, y, z); g.add(rb);
        }
      }
    }

    // ─ Rails at each level (shuttle runs on these) ─
    for (let l = 0; l < C.levels; l++) {
      const ry = l * C.levelHeight + 0.04;
      const railGeo = new THREE.BoxGeometry(0.045, 0.03, DL);
      [-0.38, 0.38].forEach(rx => {
        const rail = new THREE.Mesh(railGeo, M.rail);
        rail.position.set(rx, ry, 0); g.add(rail);
      });
    }

    // ─ Shuttle per level ─
    for (let l = 0; l < C.levels; l++) {
      this._buildShuttle(g, aisleIdx, l, DL);
    }

    // ─ Boxes on shelves ─
    this._placeBoxes(g, DL);
  }

  _buildShuttle(g, ai, li, DL) {
    const { cfg: C, M } = this;
    const sg = new THREE.Group();

    // Platform body
    const plat = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.13, 0.68), M.shuttle);
    sg.add(plat);

    // Side skirts (darker)
    [-0.4, 0.4].forEach(rx => {
      const sk = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.18, 0.64), M.rackDk);
      sk.position.set(rx, 0, 0); sg.add(sk);
    });

    // Top bumper bar
    const bump = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.04, 0.1), M.rackDk);
    bump.position.set(0, 0.085, 0); sg.add(bump);

    // Loading fork (slides out)
    this._box(0.55, 0.04, 0.08, M.rackDk, 0, 0.09, 0, sg);

    const y = li * C.levelHeight + 0.13;
    const startZ = (Math.random() - 0.5) * DL;
    sg.position.set(0, y, startZ);
    g.add(sg);

    this.shuttleData.push({
      mesh: sg,
      ai, li,
      posZ: startZ,
      targetZ: (Math.random() - 0.5) * DL,
      speed: 0.015 + Math.random() * 0.022,
      carrying: Math.random() > 0.45,
      waitTimer: 0,
      waiting: false,
      halfDL: DL / 2,
      baseY: y,
    });
  }

  _placeBoxes(g, DL) {
    const { cfg: C, M } = this;
    const HA = C.aisleWidth / 2;
    const RD = C.rackDepth;
    const BW = 0.62, BH = 0.48, BD = 0.68;
    const slotZ = DL / C.depth;

    for (let l = 0; l < C.levels; l++) {
      const by = l * C.levelHeight + BH/2 + 0.03;
      for (let d = 0; d < C.depth; d++) {
        const z = -DL/2 + (d + 0.5) * slotZ;
        // Left side
        if (Math.random() > 0.12) {
          const bx = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BD), M.box);
          bx.position.set(-HA - RD/2, by, z);
          bx.castShadow = true; g.add(bx);
        }
        // Right side
        if (Math.random() > 0.12) {
          const bx = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BD), M.box);
          bx.position.set(HA + RD/2, by, z);
          bx.castShadow = true; g.add(bx);
        }
      }
    }
  }

  _buildRobots(DL) {
    const { cfg: C, M } = this;
    const AS = this._as, GAP = this._gap, TW = this._tw;
    const frontZ = DL / 2 + 1.8;

    for (let a = 0; a < C.aisles; a++) {
      const ax = -TW/2 + a * (AS + GAP) + AS/2;
      const rg = new THREE.Group();

      // Base / chassis
      this._box(0.55, 0.18, 0.55, M.rack, 0, 0.09, 0, rg);
      // Body tower
      this._box(0.42, 0.9, 0.4, M.robot, 0, 0.63, 0, rg);
      // Accent stripe
      this._box(0.42, 0.06, 0.42, M.robotAcc, 0, 1.05, 0, rg);
      // Head sensor block
      this._box(0.28, 0.24, 0.28, M.rackDk, 0, 1.23, 0, rg);
      // Arm upper
      const armU = this._box(0.09, 0.52, 0.09, M.robotAcc, 0.28, 0.9, 0, rg);
      this._box(0.09, 0.09, 0.38, M.robot, 0.28, 0.62, 0, rg);
      // Gripper jaw
      [-0.1, 0.1].forEach(gz => {
        this._box(0.07, 0.04, 0.14, M.robot, 0.28, 0.44, gz, rg);
      });

      // Pallet platform
      this._box(1.05, 0.12, 0.88, M.pallet, -0.55, 0.06, 0, rg);
      // Pallet slats
      for (let s = 0; s < 3; s++) {
        this._box(1.05, 0.08, 0.06, M.rackDk, -0.55, 0.02, -0.3 + s * 0.3, rg);
      }

      // Stacked boxes on pallet
      const nRows = Math.floor(Math.random() * 3) + 1;
      const nCols = 2;
      for (let row = 0; row < nRows; row++) {
        for (let col = 0; col < nCols; col++) {
          const bx = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.38, 0.38), M.box);
          bx.position.set(-0.55 + (col - 0.5) * 0.46, 0.18 + row * 0.38, (Math.random()-0.5)*0.1);
          bx.castShadow = true; rg.add(bx);
        }
      }

      rg.position.set(ax, 0, frontZ + (Math.random() - 0.5) * 0.8);
      this.scene.add(rg);

      this.robotData.push({
        group: rg,
        armU, ax,
        bobT: Math.random() * Math.PI * 2,
        armT: Math.random() * Math.PI * 2,
      });
    }
  }

  // ── Update loop ──────────────────────────────────────────

  _updateShuttles() {
    const t = performance.now() * 0.001;
    this.shuttleData.forEach((sh, i) => {
      if (sh.waiting) {
        sh.waitTimer -= 0.016;
        if (sh.waitTimer <= 0) {
          sh.waiting = false;
          sh.targetZ = (Math.random() - 0.5) * sh.halfDL * 2;
          sh.carrying = Math.random() > 0.35;
        }
        return;
      }
      const diff = sh.targetZ - sh.posZ;
      if (Math.abs(diff) < 0.04) {
        sh.posZ = sh.targetZ;
        sh.waiting = true;
        sh.waitTimer = 0.4 + Math.random() * 1.8;
      } else {
        sh.posZ += Math.sign(diff) * sh.speed * 60 * 0.016;
      }
      sh.mesh.position.z = sh.posZ;
      // Subtle bob
      sh.mesh.position.y = sh.baseY + Math.sin(t * 2.5 + i) * 0.008;

      // Color highlight when carrying
      sh.mesh.children[0].material = sh.carrying ? this.M.shuttleHL : this.M.shuttle;
    });
  }

  _updateRobots() {
    const t = performance.now() * 0.001;
    this.robotData.forEach(r => {
      r.armT += 0.016;
      r.armU.position.y = 0.9 + Math.sin(r.armT * 0.7) * 0.18;
      r.armU.rotation.z = Math.sin(r.armT * 0.5) * 0.3;
    });
  }

  _applyCamPos() {
    const { orb, camTarget, camera } = this;
    const x = camTarget.x + orb.r * Math.sin(orb.theta) * Math.cos(orb.phi);
    const y = camTarget.y + orb.r * Math.sin(orb.phi);
    const z = camTarget.z + orb.r * Math.cos(orb.theta) * Math.cos(orb.phi);
    camera.position.set(x, y, z);
    camera.lookAt(camTarget);
  }

  _loop() {
    if (!this.alive) return;
    requestAnimationFrame(() => this._loop());

    // Lerp orbit
    const LS = 0.055;
    this.orb.theta += (this.orb.tTheta - this.orb.theta) * LS;
    this.orb.phi   += (this.orb.tPhi   - this.orb.phi)   * LS;
    this.orb.r     += (this.orb.tR     - this.orb.r)     * LS;
    this.camTarget.lerp(this.camGoal, LS);

    // Auto-rotate in silo view
    if (this.view === 'silo' && !this.drag.active) {
      this.orb.tTheta += 0.0008;
    }

    this._applyCamPos();
    this._updateShuttles();
    this._updateRobots();
    this.renderer.render(this.scene, this.camera);
  }

  // ── Public API ───────────────────────────────────────────

  setView(view, aisleIdx) {
    this.view = view;
    this.selectedAisle = aisleIdx;
    const C = this.cfg;
    const AS = this._as, GAP = this._gap, TW = this._tw, DL = this._dl;
    const ax = -TW/2 + aisleIdx * (AS + GAP) + AS/2;

    if (view === 'silo') {
      this.orb.tTheta = 0.6; this.orb.tPhi = 0.42; this.orb.tR = 38;
      this.camGoal.set(0, 3.5, 0);
    } else if (view === 'aisle') {
      this.orb.tTheta = Math.PI; this.orb.tPhi = 0.28; this.orb.tR = 16;
      this.camGoal.set(ax, 3, 0);
    } else if (view === 'shuttle') {
      const sh = this.shuttleData.find(s => s.ai === aisleIdx);
      const ly = sh ? sh.baseY : 2;
      this.orb.tTheta = 0.2; this.orb.tPhi = 0.18; this.orb.tR = 5.5;
      this.camGoal.set(ax, ly + 0.5, sh ? sh.posZ : 0);
    }
  }

  _resize() {
    const { canvas, renderer, camera } = this;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    if (camera) { camera.aspect = w / h; camera.updateProjectionMatrix(); }
  }

  _bindEvents() {
    const { canvas } = this;

    canvas.addEventListener('mousedown', e => {
      this.drag.active = true; this.drag.x = e.clientX; this.drag.y = e.clientY;
    });
    window.addEventListener('mouseup', () => { this.drag.active = false; });
    window.addEventListener('mousemove', e => {
      if (!this.drag.active) return;
      const dx = e.clientX - this.drag.x, dy = e.clientY - this.drag.y;
      this.drag.x = e.clientX; this.drag.y = e.clientY;
      this.orb.tTheta -= dx * 0.004;
      this.orb.tPhi = Math.max(0.06, Math.min(1.45, this.orb.tPhi - dy * 0.004));
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      this.orb.tR = Math.max(2.5, Math.min(70, this.orb.tR + e.deltaY * 0.04));
    }, { passive: false });

    // Touch
    let lastTouch = null;
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 1 && lastTouch) {
        const dx = e.touches[0].clientX - lastTouch.x;
        const dy = e.touches[0].clientY - lastTouch.y;
        this.orb.tTheta -= dx * 0.005;
        this.orb.tPhi = Math.max(0.06, Math.min(1.45, this.orb.tPhi - dy * 0.005));
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    }, { passive: false });

    const ro = new ResizeObserver(() => this._resize());
    ro.observe(canvas);
    this._ro = ro;
  }

  dispose() {
    this.alive = false;
    this._ro?.disconnect();
    this.renderer.dispose();
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// REACT UI
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const FF = "'Helvetica Neue', Helvetica, Arial, sans-serif";

// Typography tokens — Inditex style
const T = {
  nav:   { fontSize: 11, letterSpacing: '0.12em', textTransform: 'uppercase', fontWeight: 400 },
  brand: { fontSize: 15, letterSpacing: '0.26em', textTransform: 'uppercase', fontWeight: 500 },
  label: { fontSize: 9,  letterSpacing: '0.16em', textTransform: 'uppercase', color: '#aaa' },
  value: { fontSize: 11, letterSpacing: '0.04em', fontWeight: 500, color: '#000' },
  micro: { fontSize: 9,  letterSpacing: '0.12em', textTransform: 'uppercase', color: '#ccc' },
  section: { fontSize: 9, letterSpacing: '0.18em', textTransform: 'uppercase', fontWeight: 500 },
};

function Hr({ my = 16 }) {
  return <div style={{ borderTop: '1px solid #ebebeb', margin: `${my}px 0` }} />;
}

// ── Minimal toggle ────────────────────────────────────────
function Toggle({ value, onChange }) {
  return (
    <div
      onClick={() => onChange(!value)}
      style={{
        width: 28, height: 14, position: 'relative',
        background: value ? '#000' : '#e0e0e0',
        cursor: 'pointer', flexShrink: 0,
        transition: 'background 0.2s',
      }}
    >
      <div style={{
        position: 'absolute', top: 2,
        left: value ? 16 : 2,
        width: 10, height: 10,
        background: '#fff',
        transition: 'left 0.2s',
      }} />
    </div>
  );
}

// ── Config field row ──────────────────────────────────────
function CfgInput({ label, value, onChange, placeholder, type = 'text' }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ ...T.label, marginBottom: 5 }}>{label}</div>
      <input
        type={type} value={value} onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        style={{
          width: '100%', border: 'none', borderBottom: '1px solid #e0e0e0',
          padding: '5px 0', fontSize: 11, fontFamily: FF,
          outline: 'none', letterSpacing: '0.02em', background: 'transparent',
          color: '#000',
        }}
      />
    </div>
  );
}

function CfgSlider({ label, value, onChange, min, max, step = 1, unit = '' }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
        <span style={{ ...T.label }}>{label}</span>
        <span style={{ fontSize: 10, color: '#000', letterSpacing: '0.04em' }}>{value}{unit}</span>
      </div>
      <input
        type="range" min={min} max={max} step={step} value={value}
        onChange={e => onChange(Number(e.target.value))}
        style={{ width: '100%', accentColor: '#000', height: 1 }}
      />
    </div>
  );
}

function CfgToggle({ label, value, onChange }) {
  return (
    <div style={{
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      paddingBottom: 12, marginBottom: 12, borderBottom: '1px solid #f4f4f4',
    }}>
      <span style={{ ...T.label, color: '#666' }}>{label}</span>
      <Toggle value={value} onChange={onChange} />
    </div>
  );
}

// ── Stat row ──────────────────────────────────────────────
function StatRow({ label, value, accent }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0' }}>
      <span style={{ ...T.label }}>{label}</span>
      <span style={{ ...T.value, color: accent || '#000' }}>{value}</span>
    </div>
  );
}

// ━━ NAV ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function Nav({ view, setView, liveCount, sidebarOpen }) {
  const SIDEBAR_W = sidebarOpen ? 48 + 280 : 48;
  return (
    <div style={{
      position: 'fixed', top: 0, left: 0, right: 0, height: 48,
      display: 'flex', alignItems: 'center',
      background: 'rgba(255,255,255,0.97)',
      backdropFilter: 'blur(10px)',
      borderBottom: '1px solid #e8e8e8',
      zIndex: 300, fontFamily: FF,
    }}>
      {/* Left: view tabs — offset by sidebar */}
      <div style={{
        display: 'flex', gap: 24, ...T.nav,
        paddingLeft: SIDEBAR_W + 24,
        transition: 'padding-left 0.3s ease',
      }}>
        {[['silo', 'Silo'], ['aisle', 'Aisle'], ['shuttle', 'Shuttle']].map(([v, lbl]) => (
          <span
            key={v} onClick={() => setView(v)}
            style={{
              cursor: 'pointer',
              opacity: view === v ? 1 : 0.3,
              paddingBottom: 3,
              borderBottom: view === v ? '1px solid #000' : '1px solid transparent',
              transition: 'all 0.2s', userSelect: 'none',
            }}
          >{lbl}</span>
        ))}
      </div>

      {/* Center brand */}
      <div style={{
        ...T.brand, position: 'absolute',
        left: '50%', transform: 'translateX(-50%)',
        pointerEvents: 'none',
      }}>SILOS</div>

      {/* Right: live indicator */}
      <div style={{ marginLeft: 'auto', paddingRight: 28, display: 'flex', alignItems: 'center', gap: 6, ...T.nav, color: '#aaa' }}>
        <span style={{
          width: 6, height: 6, borderRadius: '50%', background: '#22c55e',
          display: 'inline-block', animation: 'pulse 2.4s infinite',
        }} />
        {liveCount} activos
      </div>
    </div>
  );
}

// ━━ LEFT SIDEBAR ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const SIDEBAR_ITEMS = [
  { id: 'visualizacion', label: 'Visualización' },
  { id: 'sistema',       label: 'Sistema'        },
  { id: 'configuracion', label: 'Configuración'  },
];

function Sidebar({ active, setActive }) {
  return (
    <div style={{
      position: 'fixed', left: 0, top: 48, bottom: 0, width: 48,
      background: '#fff', borderRight: '1px solid #e8e8e8',
      zIndex: 250, display: 'flex', flexDirection: 'column',
      alignItems: 'center', paddingTop: 32, gap: 36,
      fontFamily: FF,
    }}>
      {SIDEBAR_ITEMS.map(item => {
        const isActive = active === item.id;
        return (
          <div
            key={item.id}
            onClick={() => setActive(isActive ? null : item.id)}
            title={item.label}
            style={{
              writingMode: 'vertical-rl',
              transform: 'rotate(180deg)',
              fontSize: 9, letterSpacing: '0.18em',
              textTransform: 'uppercase',
              cursor: 'pointer', userSelect: 'none',
              color: isActive ? '#000' : '#bbb',
              borderLeft: isActive ? '1px solid #000' : '1px solid transparent',
              paddingLeft: 5, paddingBottom: 2,
              transition: 'color 0.2s, border-color 0.2s',
            }}
          >{item.label}</div>
        );
      })}

      {/* Bottom dot — version */}
      <div style={{ marginTop: 'auto', marginBottom: 20 }}>
        <div style={{ width: 4, height: 4, borderRadius: '50%', background: '#e0e0e0' }} />
      </div>
    </div>
  );
}

// ━━ PANEL: VISUALIZACIÓN ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function PanelVisualizacion({ view, setView, selectedAisle, setSelectedAisle, cfg }) {
  return (
    <div style={{ padding: '28px 24px', fontFamily: FF }}>
      <div style={{ ...T.section, marginBottom: 24, color: '#000' }}>Visualización</div>

      <div style={{ ...T.label, marginBottom: 12 }}>Modo de vista</div>
      {[['silo', 'Silo global'], ['aisle', 'Pasillo'], ['shuttle', 'Shuttle']].map(([v, lbl]) => (
        <div
          key={v}
          onClick={() => setView(v)}
          style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '9px 0', borderBottom: '1px solid #f4f4f4',
            cursor: 'pointer',
          }}
        >
          <div style={{
            width: 6, height: 6, borderRadius: '50%',
            background: view === v ? '#000' : 'transparent',
            border: '1px solid ' + (view === v ? '#000' : '#ccc'),
            flexShrink: 0, transition: 'all 0.15s',
          }} />
          <span style={{ fontSize: 11, color: view === v ? '#000' : '#888', letterSpacing: '0.04em' }}>{lbl}</span>
        </div>
      ))}

      {(view === 'aisle' || view === 'shuttle') && (
        <>
          <div style={{ ...T.label, marginTop: 20, marginBottom: 10 }}>Pasillo seleccionado</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
            {Array.from({ length: cfg.aisles }, (_, i) => (
              <button
                key={i}
                onClick={() => setSelectedAisle(i)}
                style={{
                  width: 28, height: 28,
                  border: `1px solid ${selectedAisle === i ? '#000' : '#e0e0e0'}`,
                  background: selectedAisle === i ? '#000' : 'transparent',
                  color: selectedAisle === i ? '#fff' : '#888',
                  fontSize: 9, cursor: 'pointer',
                  fontFamily: FF, transition: 'all 0.15s',
                }}
              >{i + 1}</button>
            ))}
          </div>
        </>
      )}

      <Hr my={20} />
      <div style={{ ...T.micro }}>Arrastrar para orbitar · Scroll para zoom</div>
    </div>
  );
}

// ━━ PANEL: SISTEMA ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function PanelSistema({ cfg, mockData }) {
  const activeShuttles = mockData.shuttles.filter(s => s.status === 'active').length;
  const totalThruput   = mockData.robots.reduce((s, r) => s + r.throughput, 0);
  const ts = new Date(mockData.timestamp).toLocaleTimeString('es-ES');

  return (
    <div style={{ padding: '28px 24px', fontFamily: FF }}>
      <div style={{ ...T.section, marginBottom: 24, color: '#000' }}>Sistema</div>

      <div style={{ ...T.label, marginBottom: 10 }}>Estructura</div>
      <StatRow label="Pasillos" value={cfg.aisles} />
      <StatRow label="Niveles"  value={cfg.levels} />
      <StatRow label="Profundidad" value={cfg.depth + ' slots'} />

      <Hr my={16} />
      <div style={{ ...T.label, marginBottom: 10 }}>Estado en tiempo real</div>
      <StatRow label="Shuttles activos" value={`${activeShuttles} / ${cfg.aisles * cfg.levels}`} accent="#22c55e" />
      <StatRow label="Robots"           value={cfg.aisles} />
      <StatRow label="Throughput"       value={`${totalThruput} /h`} />
      <StatRow label="Ocupación"        value="82%" />

      <Hr my={16} />
      <div style={{ ...T.label, marginBottom: 10 }}>Por pasillo</div>
      {mockData.robots.map((r, i) => (
        <div key={r.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0', borderBottom: '1px solid #f8f8f8' }}>
          <span style={{ ...T.label, color: '#999' }}>A{String(i+1).padStart(2,'0')}</span>
          <span style={{ fontSize: 9, letterSpacing: '0.04em', color: r.status === 'picking' ? '#22c55e' : '#bbb' }}>
            {r.status === 'picking' ? '● ACTIVO' : '○ IDLE'}
          </span>
          <span style={{ fontSize: 9, color: '#999', letterSpacing: '0.02em' }}>{r.throughput}/h</span>
        </div>
      ))}

      <Hr my={16} />
      <div style={{ ...T.micro }}>Última actualización: {ts}</div>
    </div>
  );
}

// ━━ PANEL: CONFIGURACIÓN ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function PanelConfiguracion({ cfg, setCfg, apiUrl, setApiUrl, onApply }) {
  const [localCfg, setLocalCfg]   = useState({ ...cfg });
  const [token, setToken]         = useState('');
  const [pollSec, setPollSec]     = useState(3);
  const [autoRot, setAutoRot]     = useState(true);
  const [showGrid, setShowGrid]   = useState(true);
  const [fogOn, setFogOn]         = useState(true);
  const [applied, setApplied]     = useState(false);

  function handleApply() {
    setCfg(localCfg);
    onApply();
    setApplied(true);
    setTimeout(() => setApplied(false), 2000);
  }

  return (
    <div style={{ padding: '28px 24px', fontFamily: FF, overflowY: 'auto', height: '100%' }}>
      <div style={{ ...T.section, marginBottom: 24, color: '#000' }}>Configuración</div>

      {/* ─ Conexión API ─ */}
      <div style={{ ...T.label, color: '#000', marginBottom: 14 }}>Conexión API</div>
      <CfgInput
        label="Endpoint"
        value={apiUrl}
        onChange={setApiUrl}
        placeholder="https://api.example.com/v1/silo"
      />
      <CfgInput
        label="Token de autenticación"
        value={token}
        onChange={setToken}
        type="password"
        placeholder="Bearer ···"
      />
      <CfgSlider label="Intervalo de polling" value={pollSec} onChange={setPollSec} min={1} max={30} unit="s" />

      <div style={{
        display: 'flex', alignItems: 'center', gap: 7,
        padding: '8px 10px', background: '#f8f8f8',
        marginBottom: 4,
      }}>
        <div style={{
          width: 6, height: 6, borderRadius: '50%',
          background: apiUrl ? '#22c55e' : '#e0e0e0',
        }} />
        <span style={{ fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#888' }}>
          {apiUrl ? 'Conectado a API externa' : 'Usando datos simulados'}
        </span>
      </div>

      <Hr my={20} />

      {/* ─ Estructura ─ */}
      <div style={{ ...T.label, color: '#000', marginBottom: 14 }}>Estructura del silo</div>
      <CfgSlider label="Pasillos"    value={localCfg.aisles} onChange={v => setLocalCfg(p=>({...p, aisles: v}))}    min={2} max={12} />
      <CfgSlider label="Niveles"     value={localCfg.levels} onChange={v => setLocalCfg(p=>({...p, levels: v}))}    min={2} max={8}  />
      <CfgSlider label="Profundidad" value={localCfg.depth}  onChange={v => setLocalCfg(p=>({...p, depth: v}))}     min={6} max={24} />

      <button
        onClick={handleApply}
        style={{
          width: '100%', padding: '10px 0', marginTop: 4, marginBottom: 4,
          background: applied ? '#22c55e' : '#000', color: '#fff',
          border: 'none', fontSize: 9, letterSpacing: '0.18em',
          textTransform: 'uppercase', fontFamily: FF,
          cursor: 'pointer', transition: 'background 0.3s',
        }}
      >{applied ? '✓ Aplicado' : 'Aplicar y recargar'}</button>

      <Hr my={20} />

      {/* ─ Visualización ─ */}
      <div style={{ ...T.label, color: '#000', marginBottom: 14 }}>Opciones de visualización</div>
      <CfgToggle label="Auto-rotación"  value={autoRot}  onChange={setAutoRot}  />
      <CfgToggle label="Grid de suelo"  value={showGrid} onChange={setShowGrid} />
      <CfgToggle label="Niebla de fondo" value={fogOn}   onChange={setFogOn}   />

      <Hr my={20} />
      <div style={{ ...T.micro }}>v1.0 · SILOS Logistics Viewer</div>
    </div>
  );
}

// ━━ CONFIG PANEL DRAWER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function PanelDrawer({ activeSection, cfg, setCfg, apiUrl, setApiUrl, onApply, view, setView, selectedAisle, setSelectedAisle, mockData }) {
  const isOpen = !!activeSection;
  return (
    <div style={{
      position: 'fixed', left: 48, top: 48, bottom: 0,
      width: isOpen ? 280 : 0,
      overflow: 'hidden',
      background: '#fff',
      borderRight: isOpen ? '1px solid #e8e8e8' : 'none',
      zIndex: 240,
      transition: 'width 0.28s cubic-bezier(0.4,0,0.2,1)',
    }}>
      <div style={{ width: 280, height: '100%', overflowY: 'auto' }}>
        {activeSection === 'visualizacion' && (
          <PanelVisualizacion
            view={view} setView={setView}
            selectedAisle={selectedAisle} setSelectedAisle={setSelectedAisle}
            cfg={cfg}
          />
        )}
        {activeSection === 'sistema' && (
          <PanelSistema cfg={cfg} mockData={mockData} />
        )}
        {activeSection === 'configuracion' && (
          <PanelConfiguracion
            cfg={cfg} setCfg={setCfg}
            apiUrl={apiUrl} setApiUrl={setApiUrl}
            onApply={onApply}
          />
        )}
      </div>
    </div>
  );
}

// ━━ STATUS BAR — bottom right ━━━━━━━━━━━━━━━━━━━━━━━━━━━
function StatusBar({ view, selectedAisle, mockData }) {
  const rob = mockData.robots[selectedAisle];
  return (
    <div style={{
      position: 'fixed', bottom: 24, right: 28,
      fontFamily: FF, textAlign: 'right', zIndex: 100,
    }}>
      <div style={{ fontSize: 20, letterSpacing: '0.04em', fontWeight: 300, color: '#000' }}>
        {view.toUpperCase()}
      </div>
      {(view === 'aisle' || view === 'shuttle') && (
        <div style={{ ...T.label, marginTop: 2 }}>
          Pasillo {String(selectedAisle + 1).padStart(2, '0')}
          {rob && ` · ${rob.throughput}/h`}
        </div>
      )}
    </div>
  );
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// APP ROOT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function App() {
  const [view,          setView]          = useState('silo');
  const [selectedAisle, setSelectedAisle] = useState(0);
  const [activeSection, setActiveSection] = useState(null);
  const [apiUrl,        setApiUrl]        = useState('');
  const [cfg,           setCfg]           = useState(DEFAULT_CONFIG);
  const [mockData,      setMockData]      = useState(() => makeMockData(DEFAULT_CONFIG));
  const [sceneKey,      setSceneKey]      = useState(0);
  const [showTweaks,    setShowTweaks]    = useState(false);

  const canvasRef = useRef(null);
  const sceneRef  = useRef(null);

  const sidebarOpen = !!activeSection;
  const canvasLeft  = sidebarOpen ? 48 + 280 : 48;

  // Init / reinit Three.js scene
  useEffect(() => {
    if (!canvasRef.current) return;
    const s = new SiloScene(canvasRef.current, cfg);
    sceneRef.current = s;
    s.setView(view, selectedAisle);
    return () => s.dispose();
  }, [sceneKey]);

  // View change → camera
  useEffect(() => { sceneRef.current?.setView(view, selectedAisle); }, [view, selectedAisle]);

  // Mock / real API poll
  useEffect(() => {
    const id = setInterval(() => {
      if (!apiUrl) { setMockData(makeMockData(cfg)); return; }
      fetch(apiUrl)
        .then(r => r.json())
        .then(d => setMockData(d))
        .catch(() => setMockData(makeMockData(cfg)));
    }, 3000);
    return () => clearInterval(id);
  }, [apiUrl, cfg]);

  // Tweaks toolbar protocol
  useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const liveCount = mockData.shuttles.filter(s => s.status === 'active').length;

  return (
    <div style={{ width: '100%', height: '100%', background: '#f8f7f5', fontFamily: FF }}>

      {/* ── Nav bar ── */}
      <Nav view={view} setView={setView} liveCount={liveCount} sidebarOpen={sidebarOpen} />

      {/* ── Left sidebar (48px rail) ── */}
      <Sidebar active={activeSection} setActive={setActiveSection} />

      {/* ── Sliding panel drawer ── */}
      <PanelDrawer
        activeSection={activeSection}
        cfg={cfg} setCfg={setCfg}
        apiUrl={apiUrl} setApiUrl={setApiUrl}
        onApply={() => setSceneKey(k => k + 1)}
        view={view} setView={setView}
        selectedAisle={selectedAisle} setSelectedAisle={setSelectedAisle}
        mockData={mockData}
      />

      {/* ── Three.js canvas ── */}
      <canvas
        ref={canvasRef}
        style={{
          position: 'fixed',
          top: 48,
          left: canvasLeft,
          right: 0, bottom: 0,
          width: `calc(100% - ${canvasLeft}px)`,
          height: 'calc(100% - 48px)',
          display: 'block', cursor: 'grab',
          transition: 'left 0.28s cubic-bezier(0.4,0,0.2,1), width 0.28s cubic-bezier(0.4,0,0.2,1)',
        }}
      />

      {/* ── Bottom-right status ── */}
      <StatusBar view={view} selectedAisle={selectedAisle} mockData={mockData} />

      {/* ── Tweaks panel (toolbar toggle) ── */}
      {showTweaks && (
        <div style={{
          position: 'fixed', bottom: 28, left: '50%', transform: 'translateX(-50%)',
          width: 260, background: '#fff', border: '1px solid #e8e8e8',
          padding: '18px 20px', zIndex: 400, fontFamily: FF,
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16 }}>
            <span style={{ ...T.section, color: '#000' }}>Tweaks</span>
            <span
              onClick={() => { setShowTweaks(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); }}
              style={{ cursor: 'pointer', color: '#aaa', fontSize: 16, lineHeight: 1 }}
            >×</span>
          </div>
          <CfgSlider label="Pasillos" value={cfg.aisles} onChange={v => setCfg(p=>({...p,aisles:v}))} min={2} max={12} />
          <CfgSlider label="Niveles"  value={cfg.levels} onChange={v => setCfg(p=>({...p,levels:v}))} min={2} max={8}  />
          <CfgSlider label="Profundidad" value={cfg.depth} onChange={v => setCfg(p=>({...p,depth:v}))} min={6} max={24} />
          <button
            onClick={() => setSceneKey(k => k + 1)}
            style={{
              width: '100%', marginTop: 8, padding: '9px 0',
              background: '#000', color: '#fff', border: 'none',
              fontSize: 9, letterSpacing: '0.16em', textTransform: 'uppercase',
              fontFamily: FF, cursor: 'pointer',
            }}
          >Recargar escena</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
